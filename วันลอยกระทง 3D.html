<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วันลอยกระทง 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@600;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#ffd773;--gold2:#c98a1b;--plum:#2a0f4d;--rose:#ff8fb8;--ink:#fff7e6;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0630;overflow:hidden;font-family:'Sarabun','Noto Sans Thai',sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:0;left:0;right:0;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;pointer-events:none}
h1{margin:0;font-family:'Mali','Sarabun',serif;font-weight:700;font-size:clamp(46px,13vw,92px);line-height:1.15;background:linear-gradient(100deg,#b8741a 10%,#fff2b0 30%,#ffc94d 48%,#fff2b0 64%,#b8741a 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a2a6a) drop-shadow(0 0 18px rgba(255,170,60,.45));animation:sh 6s linear infinite}
@keyframes sh{to{background-position:-220% 0}}
header p{margin:2px 0 0;font-size:clamp(14px,3.8vw,19px);line-height:1.55;color:var(--gold);text-shadow:0 1px 8px #1a0538}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);text-align:center;font-size:13px;color:#ffe9b8;opacity:.9;pointer-events:none;transition:opacity 1.2s;text-shadow:0 1px 6px #000}
footer{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;align-items:center;gap:9px}
.row{display:flex;gap:8px;width:100%;max-width:460px}
input{flex:1;min-width:0;border:1.5px solid var(--gold2);background:rgba(30,10,60,.72);color:var(--ink);border-radius:999px;padding:12px 16px;font:inherit;font-size:16px;backdrop-filter:blur(8px)}
input::placeholder{color:#c9b3e6}
button{font:600 15px 'Sarabun',sans-serif;color:#3a1500;background:linear-gradient(#ffe38a,#e8a82e);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 2px 0 #8a5a0a,0 6px 16px rgba(0,0,0,.35);transition:transform .12s}
button:active{transform:translateY(2px) scale(.97)}
button.s{flex:1;background:rgba(40,14,78,.78);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold2)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pill{font-size:13.5px;color:var(--gold);padding:7px 20px;border-radius:999px;background:linear-gradient(#5a1a52,#3a0f3f);box-shadow:inset 0 0 0 1.5px var(--gold2);text-align:center}
#cnt{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 150px);font-size:14px;color:var(--gold);background:rgba(40,14,78,.6);padding:5px 12px;border-radius:999px;pointer-events:none}
.tag{position:fixed;transform:translate(-50%,-100%);padding:5px 12px;border-radius:12px;background:rgba(255,247,230,.92);color:#5a1a52;font-size:13.5px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity 1s;box-shadow:0 0 16px rgba(255,200,100,.6)}
@media (prefers-reduced-motion:reduce){h1{animation:none}}

.badges{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:4px}
.badges img{height:clamp(78px,21vw,112px);width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,200,100,.35))}
.badges img:nth-child(2){transform:translateY(-6px)}
h1{font-size:clamp(40px,11vw,80px)!important}
.credit{display:inline-block;margin-top:6px;padding:4px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:#3a1500;background:linear-gradient(#ffe38a,#e8a82e);box-shadow:0 2px 10px rgba(0,0,0,.4)}
#kids{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 158px);display:flex;justify-content:space-evenly;align-items:flex-end;max-width:560px;margin:0 auto;pointer-events:none}
#kids svg{height:clamp(84px,24vw,112px);width:auto;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 282px)!important}
#cnt{top:calc(env(safe-area-inset-top,0px) + 262px)!important}
@media (prefers-reduced-motion:reduce){#kids svg{animation:none}}
</style></head><body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE,AD=T.AdditiveBlending,rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,400);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?74:56;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
// sky
{const k=document.createElement('canvas');k.width=4;k.height=256;const x=k.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
[[0,'#080433'],[.3,'#2a1166'],[.5,'#7a3a92'],[.6,'#e0568f'],[.68,'#ffb36b'],[1,'#ffb36b']].forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,4,256);scene.background=new T.CanvasTexture(k)}
scene.fog=new T.FogExp2(0x34176a,.011);
function gt(c){const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.25,c);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(k)}
const tW=gt('rgba(255,255,255,.7)'),tG=gt('rgba(255,190,80,.7)'),tF=gt('rgba(255,150,40,.9)');
const sp=(t,s,x,y,z)=>{const m=new T.Sprite(new T.SpriteMaterial({map:t,blending:AD,depthWrite:false,fog:false,transparent:true}));m.scale.set(s,s,1);m.position.set(x,y,z);scene.add(m);return m};
// lights
scene.add(new T.AmbientLight(0x8a6ab8,.9));
const moon=new T.DirectionalLight(0xffd9a0,.7);moon.position.set(-10,20,10);scene.add(moon);
const pl=new T.PointLight(0xffb55a,1.6,90);pl.position.set(0,10,-18);scene.add(pl);
// stars
{const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=rnd(-150,150);p[i*3+1]=rnd(18,110);p[i*3+2]=rnd(-130,-60)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));scene.add(new T.Points(g,new T.PointsMaterial({size:1.4,map:tW,transparent:true,blending:AD,depthWrite:false,fog:false})))}
// water
const wave=(x,z,t)=>Math.sin(x*.35+t*.9)*.12+Math.sin(z*.5+t*1.3)*.09+Math.sin((x+z)*.2+t*.6)*.1;
const wg=new T.PlaneGeometry(140,64,70,40);wg.rotateX(-Math.PI/2);
const water=new T.Mesh(wg,new T.MeshPhongMaterial({color:0x1b1260,specular:0xffc27a,shininess:90,transparent:true,opacity:.92}));water.position.set(0,0,8);scene.add(water);
const wp=wg.attributes.position;
const glint=new T.Mesh(new T.PlaneGeometry(14,24),new T.MeshBasicMaterial({map:tG,blending:AD,transparent:true,opacity:.55,depthWrite:false,fog:false}));glint.rotation.x=-Math.PI/2;glint.position.set(0,.45,-12);scene.add(glint);
// bank + pagoda
const land=new T.Mesh(new T.BoxGeometry(150,1.2,18),new T.MeshPhongMaterial({color:0x140a30}));land.position.set(0,0,-33);scene.add(land);
for(let i=0;i<80;i++)sp(tF,rnd(.4,.9),rnd(-55,55),rnd(.9,1.6),-24.2);
const gold=new T.MeshPhongMaterial({color:0xffc94d,specular:0xfff0b0,shininess:70,emissive:0x7a4a00});
function prang(s){const g=new T.Group();let y=0;
[[7,7,.8],[5.6,5.6,.8],[4.2,4.2,.8]].forEach(b=>{const m=new T.Mesh(new T.BoxGeometry(b[0]*1.6,b[2],b[1]*1.6),gold);m.position.y=y+b[2]/2;y+=b[2];g.add(m)});
[[3.2,4.2,1.4],[2.6,3.4,1.4],[2,2.7,1.4],[1.4,2,1.3],[.8,1.3,1.2],[.2,.7,1.4]].forEach(t=>{const m=new T.Mesh(new T.CylinderGeometry(t[0],t[1],t[2],8),gold);m.position.y=y+t[2]/2;y+=t[2];g.add(m)});
const sc=new T.Mesh(new T.ConeGeometry(.2,2,8),gold);sc.position.y=y+1;g.add(sc);g.scale.setScalar(s);return g}
const P=[[0,2.4],[-9,1.1],[9,1.1],[-16,.75],[16,.75],[-24,.6],[24,.6]];
P.forEach(p=>{const g=prang(p[1]);g.position.set(p[0],.6,-27-Math.abs(p[0])*.1);scene.add(g)});
sp(tG,60,0,14,-30);
// lotus
const pg=new T.SphereGeometry(1,14,10);pg.scale(.3,.75,.1);pg.translate(0,.75,0);
const LAY=[[9,.9,1.1,0xff8fb8],[7,.6,.7,0xffadcf],[5,.3,.3,0xffd0e2]].map(l=>({n:l[0],r:l[1],t:l[2],m:new T.MeshPhongMaterial({color:l[3],emissive:0x66223d,shininess:40,side:T.DoubleSide})}));
function lotus(s){const g=new T.Group();LAY.forEach((l,j)=>{for(let i=0;i<l.n;i++){const pv=new T.Object3D(),h=new T.Object3D();pv.rotation.y=i/l.n*6.283+j*.4;h.position.z=l.r;h.rotation.x=l.t;h.add(new T.Mesh(pg,l.m));pv.add(h);g.add(pv)}});
const c=new T.Mesh(new T.SphereGeometry(.2,10,8),new T.MeshPhongMaterial({color:0xffc400,emissive:0x664400}));c.position.y=.35;g.add(c);g.scale.setScalar(s);return g}
const pads=[];[[-6,10,1.3],[6.5,11,1.5],[-9.5,6,1.1],[9,5,1.2],[-3.5,13,.9],[3.2,13.5,1]].forEach(a=>{const g=lotus(a[2]);g.position.set(a[0],0,a[1]);g.userData={x:a[0],z:a[1],ph:rnd(0,6)};scene.add(g);pads.push(g);
const pd=new T.Mesh(new T.CylinderGeometry(1.1*a[2],1.1*a[2],.05,20),new T.MeshPhongMaterial({color:0x1f6a3a}));pd.position.set(a[0]+1.3,.05,a[1]+.4);scene.add(pd)});
// krathong template
const KT=new T.Group();
{const b=new T.Mesh(new T.CylinderGeometry(.8,.9,.3,24),new T.MeshPhongMaterial({color:0x2f8a3f}));KT.add(b);
const L=lotus(.62);L.position.y=.15;KT.add(L);
const cone=new T.Mesh(new T.ConeGeometry(.3,.9,12),new T.MeshPhongMaterial({color:0xfffdf2,emissive:0x333322}));cone.position.y=.75;KT.add(cone);
for(let i=0;i<8;i++){const a=i/8*6.283,m=new T.Mesh(new T.SphereGeometry(.12,8,6),new T.MeshPhongMaterial({color:0xffc400,emissive:0x664400}));m.position.set(Math.cos(a)*.7,.32,Math.sin(a)*.7);KT.add(m)}
const cd=new T.Mesh(new T.CylinderGeometry(.06,.06,.7,8),new T.MeshPhongMaterial({color:0xffd23a,emissive:0x664400}));cd.position.set(.25,.9,.1);KT.add(cd);
const fl=sp(tF,.8,.25,1.45,.1);fl.name='fl';scene.remove(fl);KT.add(fl);
const gl=new T.Mesh(new T.PlaneGeometry(5,5),new T.MeshBasicMaterial({map:tF,blending:AD,transparent:true,opacity:.6,depthWrite:false,fog:false}));gl.rotation.x=-Math.PI/2;gl.position.y=.15;KT.add(gl)}
// lanterns
function lanTex(){const k=document.createElement('canvas');k.width=64;k.height=80;const x=k.getContext('2d');
let g=x.createRadialGradient(32,40,2,32,40,32);g.addColorStop(0,'rgba(255,190,80,.9)');g.addColorStop(1,'rgba(255,120,20,0)');x.fillStyle=g;x.fillRect(0,0,64,80);
g=x.createLinearGradient(0,22,0,60);g.addColorStop(0,'#fff0a8');g.addColorStop(1,'#ff9a2e');x.fillStyle=g;x.beginPath();x.roundRect?x.roundRect(20,20,24,38,6):x.rect(20,20,24,38);x.fill();return new T.CanvasTexture(k)}
const lm=new T.SpriteMaterial({map:lanTex(),blending:AD,depthWrite:false,fog:false,transparent:true}),lan=[];
function addLan(y){const s=new T.Sprite(lm);s.scale.set(1.4,1.75,1);s.position.set(rnd(-30,30),y,rnd(-20,12));s.userData={v:rnd(.5,1.1),ph:rnd(0,6)};scene.add(s);lan.push(s);if(lan.length>90)scene.remove(lan.shift())}
for(let i=0;i<45;i++)addLan(rnd(1,40));
// fireworks
const fw=[],rk=[],pal=[[1,.8,.3],[1,.45,.8],[.7,.5,1],[1,1,1],[.4,.9,1]];
let AC=null,snd=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function pop(){if(!snd||!AC)return;const n=AC.sampleRate*.5,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=900;g.gain.value=.3;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
function chime(){if(!snd||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.frequency.value=[784,880,988,1175][Math.random()*4|0];g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+1.4)}
function burst(p){const n=150,pos=new Float32Array(n*3),col=new Float32Array(n*3),vel=new Float32Array(n*3),c1=pal[Math.random()*5|0],c2=pal[Math.random()*5|0];
for(let i=0;i<n;i++){const u=rnd(-1,1),a=rnd(0,6.283),r=Math.sqrt(1-u*u),s=rnd(5,9),c=i%2?c1:c2;
pos.set([p.x,p.y,p.z],i*3);vel.set([r*Math.cos(a)*s,u*s,r*Math.sin(a)*s],i*3);col.set(c,i*3)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));g.setAttribute('color',new T.BufferAttribute(col,3));
const m=new T.PointsMaterial({size:1.3,map:tW,vertexColors:true,transparent:true,blending:AD,depthWrite:false,fog:false}),pts=new T.Points(g,m);pts.frustumCulled=false;scene.add(pts);fw.push({pts,pos,vel,t:0,n});pop()}
function rocket(to){const s=sp(tW,1,to.x,1,to.z);rk.push({s,to:to.clone(),t:0})}
const sky=()=>rocket(new T.Vector3(rnd(-22,22),rnd(14,32),rnd(-34,-14)));
// krathong logic
const kr=[],rip=[];let nK=0;const WISH=['ขอให้สมหวังดั่งใจ','ขอให้มีความสุข','ขอให้สุขภาพแข็งแรง','ขอบคุณแม่คงคา','ขอให้โชคดีตลอดปี'];
function launch(x,z){ac();const g=KT.clone(true);g.position.set(x,6,z);g.scale.setScalar(.01);scene.add(g);
const w=$('w').value.trim()||WISH[Math.random()*5|0],tag=document.createElement('div');tag.className='tag';tag.textContent='🪷 '+w;document.body.appendChild(tag);
kr.push({g,x,z,t:0,ph:rnd(0,6),sp:rnd(.3,.6),tag,fl:g.getObjectByName('fl')});$('w').value='';$('cnt').textContent='🪷 '+(++nK);
if(kr.length>40){const o=kr.shift();scene.remove(o.g);o.tag.remove()}}
function ripple(x,z){const m=new T.Mesh(new T.RingGeometry(.8,1,32),new T.MeshBasicMaterial({color:0xffe6a8,transparent:true,opacity:.8,side:T.DoubleSide,depthWrite:false,fog:false}));m.rotation.x=-Math.PI/2;m.position.set(x,.3,z);scene.add(m);rip.push({m,t:0})}
// input
const rc=new T.Raycaster(),pln=new T.Plane(new T.Vector3(0,1,0),0),pt=new T.Vector2(),hit=new T.Vector3();
let dn=null,ty=0,tp=0,yaw=0,pit=0,D=36,tD=22;
function tap(x,y){pt.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);rc.setFromCamera(pt,cam);
if(rc.ray.intersectPlane(pln,hit)&&hit.z>-22&&hit.z<14&&Math.abs(hit.x)<40)launch(hit.x,hit.z);
else{const p=rc.ray.at(55,new T.Vector3());p.y=Math.max(p.y,10);rocket(p)}$('hint').style.opacity=0}
const cv=$('c');
cv.addEventListener('pointerdown',e=>{ac();dn={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,m:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.m+=Math.abs(dx)+Math.abs(dy);dn.x=e.clientX;dn.y=e.clientY;ty=cl(ty-dx*.004,-.9,.9);tp=cl(tp+dy*.003,-.2,.4)});
cv.addEventListener('pointerup',e=>{if(dn&&dn.m<8)tap(e.clientX,e.clientY);dn=null});
cv.addEventListener('wheel',e=>{tD=cl(tD+e.deltaY*.01,14,30)},{passive:true});
$('bk').onclick=()=>launch(rnd(-3,3),rnd(4,9));
$('bl').onclick=()=>{ac();for(let i=0;i<14;i++)addLan(rnd(.3,3))};
$('bf').onclick=()=>{ac();for(let i=0;i<3;i++)setTimeout(sky,i*300)};
$('bs').onclick=e=>{snd=!snd;e.target.textContent=snd?'🔊':'🔇';ac()};

// students in school uniform holding krathong
(function(){const sk='#f3c9a0',nv='#1d2a5a',bl='#1f4fc4',ye='#f5b400';
const K=[{h:'#1a1210',st:'bob',g:1},{h:'#2a1a14',st:'braid'},{h:'#14100e',st:'short',g:1},{h:'#3a2218',st:'braid',g:1},{h:'#1a1210',st:'bob'}];
function hair(k){if(k.st==='short')return `<path d="M25 30Q24 14 40 14Q56 14 55 30Q50 21 40 21Q30 21 25 30Z" fill="${k.h}"/>`;
const side=k.st==='braid'?`<path d="M26 26Q22 44 27 62" stroke="${k.h}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="4 1.5"/><path d="M54 26Q58 44 53 62" stroke="${k.h}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="4 1.5"/>`:`<path d="M25 24Q22 40 28 42L30 26ZM55 24Q58 40 52 42L50 26Z" fill="${k.h}"/>`;
return side+`<path d="M25 30Q24 13 40 13Q56 13 55 30Q48 20 40 24Q32 20 25 30Z" fill="${k.h}"/>`}
function kid(k){return `<svg viewBox="0 0 80 124" xmlns="http://www.w3.org/2000/svg">
<rect x="29" y="92" width="9" height="28" rx="3" fill="${nv}"/><rect x="42" y="92" width="9" height="28" rx="3" fill="${nv}"/>
<ellipse cx="33" cy="121" rx="7" ry="3" fill="#1a1a2a"/><ellipse cx="47" cy="121" rx="7" ry="3" fill="#1a1a2a"/>
<path d="M24 52Q40 45 56 52L58 94L22 94Z" fill="#fff"/><rect x="22" y="88" width="36" height="12" rx="4" fill="${nv}"/>
<path d="M24 52L37 49L35 60L21 64Z" fill="${ye}"/><path d="M56 52L43 49L45 60L59 64Z" fill="${ye}"/>
<path d="M32 48L40 59L48 48L44 46L40 51L36 46Z" fill="${bl}"/>
<path d="M24 56Q18 74 35 82" stroke="${bl}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M56 56Q62 74 45 82" stroke="${bl}" stroke-width="8" fill="none" stroke-linecap="round"/>
<rect x="38" y="42" width="4" height="7" fill="${sk}"/>
<circle cx="40" cy="30" r="14" fill="${sk}"/>${hair(k)}
<circle cx="34.5" cy="31" r="1.4" fill="#2a1a14"/><circle cx="45.5" cy="31" r="1.4" fill="#2a1a14"/><path d="M36.5 37Q40 40 43.5 37" stroke="#b5584a" stroke-width="1.3" fill="none" stroke-linecap="round"/>
${k.g?'<g fill="none" stroke="#9a9aa8" stroke-width="1.1"><circle cx="34.5" cy="31" r="5"/><circle cx="45.5" cy="31" r="5"/><path d="M39.5 30h1"/></g>':''}
<ellipse cx="40" cy="90" rx="17" ry="4.5" fill="#2f8a3f"/>
<g fill="#ff8fb8" stroke="#c23f7a" stroke-width=".6"><path d="M26 86Q22 76 30 78Q32 84 30 88Z"/><path d="M54 86Q58 76 50 78Q48 84 50 88Z"/><path d="M32 88Q30 74 38 76Q39 84 38 88Z"/><path d="M48 88Q50 74 42 76Q41 84 42 88Z"/></g>
<path d="M40 88Q35 76 40 70Q45 76 40 88Z" fill="#ffadcf" stroke="#c23f7a" stroke-width=".6"/>
<rect x="38.6" y="62" width="2.8" height="10" fill="#ffd23a"/><ellipse cx="40" cy="59" rx="2.2" ry="3.6" fill="#ff9a2e"/><circle cx="40" cy="59" r="7" fill="#ffb84a" opacity=".3"/>
<circle cx="31" cy="83" r="3.6" fill="${sk}"/><circle cx="49" cy="83" r="3.6" fill="${sk}"/></svg>`}
const e=document.getElementById('kids');e.innerHTML=K.map(kid).join('');
[...e.children].forEach((c,i)=>c.style.animationDelay=(i*.4)+'s')})();
// loop
const clk=new T.Clock();let el=0,auto=1.5;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);el+=dt;
for(let i=0;i<wp.count;i++)wp.setY(i,wave(wp.getX(i),wp.getZ(i)+8,el));wp.needsUpdate=true;wg.computeVertexNormals();
glint.material.opacity=.45+Math.sin(el*2)*.12;
pads.forEach(g=>{g.position.y=wave(g.userData.x,g.userData.z,el)+.1;g.rotation.z=Math.sin(el*.8+g.userData.ph)*.05});
lan.forEach(s=>{const u=s.userData;s.position.y+=u.v*dt;s.position.x+=Math.sin(el*.5+u.ph)*.35*dt;if(s.position.y>42){s.position.set(rnd(-30,30),0,rnd(-20,12))}});
kr.forEach(o=>{o.t+=dt;const e=Math.min(o.t/1.2,1);o.x+=o.sp*dt*.7;o.z-=.12*dt;const g=o.g;
g.position.set(o.x,wave(o.x,o.z,el)+.15+(1-e)*(1-e)*6,o.z);g.scale.setScalar(Math.max(e,.01));g.rotation.y+=dt*.15;g.rotation.z=Math.sin(el+o.ph)*.05;
if(o.t>1.2&&!o.r){o.r=1;ripple(o.x,o.z);chime()}
o.fl.scale.setScalar(.8+Math.sin(el*14+o.ph)*.12);
const v=g.position.clone();v.y+=1.8;v.project(cam);o.tag.style.left=((v.x*.5+.5)*innerWidth)+'px';o.tag.style.top=((-v.y*.5+.5)*innerHeight)+'px';
o.tag.style.opacity=(v.z>1||o.t>9||o.t<1.2)?0:1});
for(let i=rip.length-1;i>=0;i--){const r=rip[i];r.t+=dt;r.m.scale.setScalar(1+r.t*3);r.m.material.opacity=Math.max(0,.8-r.t*.8);if(r.t>1){scene.remove(r.m);rip.splice(i,1)}}
for(let i=rk.length-1;i>=0;i--){const r=rk[i];r.t+=dt/.9;const e=Math.min(r.t,1);r.s.position.set(r.to.x,1+(r.to.y-1)*e*(2-e),r.to.z);if(r.t>=1){scene.remove(r.s);burst(r.to);rk.splice(i,1)}}
for(let i=fw.length-1;i>=0;i--){const f=fw[i];f.t+=dt;for(let j=0;j<f.n;j++){f.vel[j*3+1]-=3.5*dt;for(let k=0;k<3;k++){f.vel[j*3+k]*=.985;f.pos[j*3+k]+=f.vel[j*3+k]*dt}}
f.pts.geometry.attributes.position.needsUpdate=true;f.pts.material.opacity=Math.max(0,1-f.t/2.4);f.pts.material.size=1.3*(1-f.t/4);
if(f.t>2.4){scene.remove(f.pts);f.pts.geometry.dispose();f.pts.material.dispose();fw.splice(i,1)}}
if((auto-=dt)<0){auto=rnd(1.6,3.2);sky()}
tD+=(0-0);D+=(tD-D)*.03;yaw+=(ty-yaw)*.07;pit+=(tp-pit)*.07;const y=yaw+Math.sin(el*.2)*.03;
cam.position.set(Math.sin(y)*D,4+pit*12,-6+Math.cos(y)*D);cam.lookAt(0,12-pit*8,-24);
R.render(scene,cam)}
loop();setTimeout(()=>{$('hint').style.opacity=0},9000);
</script></body></html>
